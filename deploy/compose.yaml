# maniac-duo on a box: the relay on loopback only. The box's own front (Atoll's
# boxfront) gives it its public name and TLS.
name: maniac-duo

services:
  relay:
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
    volumes: [games:/data]

volumes:
  games:
